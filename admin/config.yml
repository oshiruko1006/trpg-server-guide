backend:
  name: github
  repo: oshiruko1006/trpg-server-guide
  branch: main
  base_url: https://trpg-server-guide-auth.kocco-and-chiri.workers.dev
  auth_endpoint: auth
media_folder: assets/images
public_folder: /assets/images
locale: ja
collections:
- name: pages
  label: ページ設定
  files:
  - name: home
    label: HOME（聖規則）
    file: content/home.json
    fields:
    - label: タイトル
      name: title
      widget: string
    - label: 紹介文
      name: intro
      widget: text
      required: false
    - label: ルールの項目
      name: sections
      widget: list
      summary: '{{fields.heading}}'
      fields:
      - label: 題目
        name: heading
        widget: string
      - label: 本文
        name: body
        widget: markdown
  - name: character
    label: CS GUIDE（CS作成）
    file: content/character.json
    fields:
    - label: タイトル
      name: title
      widget: string
    - label: 説明
      name: intro
      widget: text
      required: false
    - label: システム別ルール
      name: systems
      widget: list
      summary: '{{fields.name}}'
      fields:
      - label: システム名
        name: name
        widget: string
      - label: ルールのブロック
        name: sections
        widget: list
        summary: '{{fields.heading}}'
        fields:
        - label: 題目
          name: heading
          widget: string
        - label: 本文
          name: body
          widget: markdown
  - name: request
    label: REQUEST（KP依頼）
    file: content/request.json
    fields:
    - label: タイトル
      name: title
      widget: string
    - label: 受付状況
      name: status
      widget: select
      options:
      - label: 受付中
        value: open
      - label: 要相談
        value: consult
      - label: 受付停止
        value: closed
    - label: 受付状況の説明
      name: status_message
      widget: text
    - label: KP依頼について
      name: kp_about
      widget: text
      required: false
      hint: 改行を保持し、Markdown記法も公開ページに反映します
    - label: 注意事項
      name: notices
      widget: text
      required: false
    - label: 依頼テンプレート（コピー可能）
      name: template
      widget: text
      required: false
    - label: 自由追加ブロック
      name: extra_sections
      widget: list
      required: false
      summary: '{{fields.heading}}'
      fields:
      - label: 題目
        name: heading
        widget: string
      - label: 本文
        name: body
        widget: text
        required: false
      - label: 添付ファイル（複数追加可）
        name: attachments
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
        - label: ファイル名・説明（任意）
          name: label
          widget: string
          required: false
        - label: ファイルを選択
          name: file
          widget: file
    - label: Discordリンク
      name: discord_url
      widget: string
      required: false
- name: scenarios
  label: SCENARIO（回せるシナリオ）
  folder: content/scenarios
  create: true
  extension: json
  format: json
  slug: '{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}'
  identifier_field: title
  fields:
  - label: タイトル
    name: title
    widget: string
  - label: 読み仮名（ひらがな）
    name: reading
    widget: string
    required: false
    hint: 五十音順・検索に使用
  - label: URL識別子（既存データ保持用）
    name: slug
    widget: hidden
    required: false
  - label: システム
    name: system
    widget: select
    options:
    - CoC6版
    - CoC7版
  - label: プレイ人数
    name: players
    widget: select
    options:
    - フリー
    - タイマン
    - 1PL
    - 2PL
    - 3PL
    - 4PL
    - 5PL以上
  - label: 所要時間
    name: duration
    widget: select
    options:
    - 短編
    - 中編
    - 長編
    - 超長編
  - label: 対象年齢
    name: age_rating
    widget: select
    default: 全年齢
    options:
    - 全年齢
    - R-15
    - R-18
    hint: 公開ページの基本情報と絞り込みに反映します
  - label: タグ
    name: tags
    widget: vanilla_tags
    required: false
    options:
    - 低ロス
    - 中ロス
    - 高ロス
    - 描写多め
    - 描写少なめ
    - RP中心
    - クラシック
    - 探索中心
    - 戦闘有
    - 謎解き有
    - ホラー
    - エモ
    - ギャグ
    - クローズド
    - シティ
    - 秘匿HO
    - 公開HO
    - HOなし
    - 新規限定
    - 継続可
    - PvP有
    - エロ
    - エログロ
    - インモラル
    - 近親相姦
    - バディ
    - SAN値回復
    - ロスト救済
    hint: ボタンで複数選択できます。下の入力欄から自由タグも追加できます。
  - label: 自由追加タグ（任意）
    name: custom_tags
    widget: list
    required: false
    field:
      label: タグ
      name: tag
      widget: string
  - label: シナリオトレーラー画像
    name: trailers
    widget: list
    required: false
    summary: '{{fields.image}}'
    hint: 画像を追加するとカード表示と詳細ページに表示されます。複数枚登録可能で、1枚目が一覧の表紙になります。
    field:
      label: トレーラー画像
      name: image
      widget: image
      allow_multiple: false
  - label: あらすじ
    name: summary
    widget: text
    required: false
  - label: 概要
    name: overview
    widget: text
    required: false
  - label: 注意事項
    name: cautions
    widget: text
    required: false
  - label: 自由追加ブロック
    name: extra_sections
    widget: list
    required: false
    summary: '{{fields.heading}}'
    fields:
    - label: 題目
      name: heading
      widget: string
    - label: 本文
      name: body
      widget: text
      required: false
  - label: 配布・販売ページのリンク（BOOTHなど）
    name: external_links
    widget: list
    required: false
    summary: '{{fields.label}}'
    fields:
    - label: リンク名（例：BOOTH）
      name: label
      widget: string
    - label: URL
      name: url
      widget: string
      pattern: ['^https://.+', 'https://から始まるURLを入力してください']
  - label: 公開する
    name: published
    widget: boolean
    default: false

backend:
  name: github
  repo: oshiruko1006/trpg-server-guide
  branch: main
  base_url: https://trpg-server-guide-auth.kocco-and-chiri.workers.dev
  auth_endpoint: auth
media_folder: "assets/images"
public_folder: "/assets/images"
locale: ja
collections:
  - name: pages
    label: ページ設定
    files:
      - name: home
        label: HOME（聖規則）
        file: content/home.json
        fields:
          - {label: タイトル, name: title, widget: string}
          - {label: 紹介文, name: intro, widget: text, required: false}
          - label: ルールの項目
            name: sections
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - {label: 題目, name: heading, widget: string}
              - {label: 本文, name: body, widget: markdown}
      - name: character
        label: CS GUIDE（CS作成）
        file: content/character.json
        fields:
          - {label: タイトル, name: title, widget: string}
          - {label: 説明, name: intro, widget: text, required: false}
          - label: システム別ルール
            name: systems
            widget: list
            summary: "{{fields.name}}"
            fields:
              - {label: システム名, name: name, widget: string}
              - label: ルールのブロック
                name: sections
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - {label: 題目, name: heading, widget: string}
                  - {label: 本文, name: body, widget: markdown}
      - name: request
        label: REQUEST（KP依頼）
        file: content/request.json
        fields:
          - {label: タイトル, name: title, widget: string}
          - label: 受付状況
            name: status
            widget: select
            options:
              - {label: 受付中, value: open}
              - {label: 要相談, value: consult}
              - {label: 受付停止, value: closed}
          - {label: 受付状況の説明, name: status_message, widget: text}
          - {label: 依頼ルール, name: rules, widget: markdown}
          - {label: 依頼手順, name: steps, widget: text}
          - {label: コピー用テンプレート, name: template, widget: text}
          - {label: Discordリンク, name: discord_url, widget: string, required: false}
  - name: scenarios
    label: SCENARIO（回せるシナリオ）
    folder: content/scenarios
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - {label: タイトル, name: title, widget: string}
      - {label: 読み仮名（ひらがな）, name: reading, widget: string, required: false, hint: 五十音順・検索に使用}
      - {label: URL識別子, name: slug, widget: string, hint: 半角小文字・数字・ハイフンのみ}
      - {label: システム, name: system, widget: string}
      - label: プレイ人数
        name: players
        widget: select
        options: ["フリー", "タイマン", "1PL", "2PL", "3PL", "4PL", "5PL以上"]
      - label: 所要時間
        name: duration
        widget: select
        options: ["1～4時間", "5～8時間", "9～15時間", "16～20時間", "21時間～"]
      - {label: タグ, name: tags, widget: list, required: false, field: {label: タグ名, name: tag, widget: string}, hint: 追加ボタンで自由に登録}
      - {label: あらすじ, name: summary, widget: markdown}
      - {label: 公開する, name: published, widget: boolean, default: false}
